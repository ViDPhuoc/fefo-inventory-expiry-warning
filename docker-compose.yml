# Tách DB demo khỏi DB cũ; chỉ mở cổng trên chính máy người chạy.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: canhbao_hethan_demo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d canhbao_hethan_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    command: >
      sh -c "python -m app.cli ensure-demo &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/canhbao_hethan_demo
      APP_TODAY: ${APP_TODAY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata_demo:
